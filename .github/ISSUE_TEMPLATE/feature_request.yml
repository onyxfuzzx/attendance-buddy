name: Feature request
description: Suggest a useful improvement for your team.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do?
      description: Describe the situation and who it would help.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your proposed improvement
      description: Explain the behavior you would like and any alternatives you considered.
    validations:
      required: true
